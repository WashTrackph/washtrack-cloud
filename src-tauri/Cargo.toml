[package]
name = "washtrack-pos"
version = "1.0.0"
description = "WashTrack POS - Laundry Point of Sale System"
authors = ["WashTrack"]
license = "MIT"
repository = "https://github.com/Sterlingdev17/Washtrack"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
tokio = { version = "1", features = ["rt", "macros"] }
semaphore-sms = { path = "semaphore-sms", features = ["tauri"] }
tauri-plugin-printer = { path = "tauri-plugin-printer" }
