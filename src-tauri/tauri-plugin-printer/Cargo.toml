[package]
name = "tauri-plugin-printer"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-printer"
exclude = ["android/build/", "android/.gradle/"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
